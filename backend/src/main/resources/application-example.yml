# 配置示例（复制为 application-local.yml 并按需修改，不要提交真实密码）
# 也可直接使用环境变量覆盖 application.yml 中的默认值。

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/canteen_system?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 请填写你的数据库密码

canteen:
  jwt:
    # 生产环境务必替换为随机长密钥（≥32 字节），仅通过环境变量注入
    secret: 请替换为随机生成的强密钥至少32字节长度
    expire-minutes: 720

  cors:
    allowed-origins:
      - http://localhost:5173
      - http://127.0.0.1:5173

  demo:
    # 生产环境请设为 false，关闭演示账号与演示订单初始化
    enabled: true
    user-password: ${DEMO_USER_PASSWORD:Demo@123456}
    admin-password: ${DEMO_ADMIN_PASSWORD:Admin@123456}
    order-seed-enabled: true

  upload:
    dir: ./uploads
    max-size-mb: 5

  ai:
    enabled: true
    base-url: ${AI_BASE_URL:https://api.deepseek.com/v1}
    # 只允许通过环境变量注入，禁止写入本文件
    api-key: ${AI_API_KEY:}
    model: ${AI_MODEL:deepseek-chat}
    timeout-seconds: 20
    temperature: 0.3
