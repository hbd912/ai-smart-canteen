server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: canteen-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:canteen_system}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 12
      minimum-idle: 2
      connection-timeout: 15000
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    encoding: UTF-8
    table: flyway_schema_history
  jackson:
    default-property-inclusion: non_null
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
    serialization:
      write-dates-as-timestamps: false
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.canteen.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
  default-produces-media-type: application/json

canteen:
  jwt:
    # 生产环境必须通过环境变量注入，长度不少于 32 字节
    secret: ${JWT_SECRET:canteen-demo-jwt-secret-key-please-change-in-production-2026}
    expire-minutes: ${JWT_EXPIRE_MINUTES:720}
    issuer: canteen-system
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173,http://127.0.0.1:4173}
  demo:
    # 课堂演示账号种子（仅开发环境）
    enabled: ${DEMO_SEED_ENABLED:true}
    user-password: ${DEMO_USER_PASSWORD:123456}
    admin-password: ${DEMO_ADMIN_PASSWORD:Admin@123456}
    order-seed-enabled: ${DEMO_ORDER_SEED_ENABLED:true}
  upload:
    dir: ${UPLOAD_DIR:./uploads}
    max-size-mb: 5
  ai:
    # 未配置 api-key 时自动进入规则推荐降级模式
    enabled: ${AI_ENABLED:true}
    base-url: ${AI_BASE_URL:https://api.deepseek.com/v1}
    api-key: ${AI_API_KEY:}
    model: ${AI_MODEL:deepseek-chat}
    timeout-seconds: ${AI_TIMEOUT_SECONDS:20}
    temperature: ${AI_TEMPERATURE:0.3}

logging:
  level:
    root: INFO
    com.canteen: INFO
    com.canteen.mapper: WARN
    org.springframework.security: WARN
